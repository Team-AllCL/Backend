name: Deploy JAR to order-server via Bastion

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      
      - name: Checkout ip-update branch to read bastion IP
        run: |
          git fetch origin ip-update
          git checkout origin/ip-update -- bastion-ip.txt

      - name: Read bastion IP from bastion-ip.txt
        id: bastion
        run: |
          BASTION_IP=$(cat bastion-ip.txt | tr -d '\n')
          echo "bastion_ip=$BASTION_IP" >> $GITHUB_OUTPUT  

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'oracle'
          java-version: '17'
          
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        
      - name: Build with Gradle (skip test)
        run: ./gradlew build -x test

      - name: Upload JAR to Bastion
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ steps.bastion.outputs.bastion_ip }}
          username: ${{ secrets.BASTION_USER }}
          key: ${{ secrets.BASTION_KEY }}
          source: build/libs/*.jar
          target: /home/${{ secrets.BASTION_USER }}/deploy/

      - name: SSH into Bastion and deploy to order-server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ steps.bastion.outputs.bastion_ip }}
          username: ${{ secrets.BASTION_USER }}
          key: ${{ secrets.BASTION_KEY }}
          script: |
            scp -i /home/ec2-user/order-server-key.pem -o StrictHostKeyChecking=no \
              /home/${{ secrets.BASTION_USER }}/*.jar \
              ${{ secrets.ORDER_USER }}@${{ secrets.ORDER_HOST }}:/home/${{ secrets.ORDER_USER }}/app/app.jar

            ssh -i /home/ec2-user/order-server-key.pem -o StrictHostKeyChecking=no \
              ${{ secrets.ORDER_USER }}@${{ secrets.ORDER_HOST }} << 'ENDSSH'
              pkill -f 'java -jar' || true
              nohup java -jar /home/${{ secrets.ORDER_USER }}/app/app.jar > /home/${{ secrets.ORDER_USER }}/app/app.log 2>&1 &
            ENDSSH
