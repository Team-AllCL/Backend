name: Build, Scan, and Push to ECR

on:
  push:
    branches:
      #- yun
      - develop

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build JAR
      run: |
        chmod +x ./gradlew
        ./gradlew clean build -x test

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set IMAGE_TAG
      id: image_tag
      run: echo "tag=$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"

    - name: Build Docker image
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.image_tag.outputs.tag }} .

    - name: Run Trivy scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.image_tag.outputs.tag }}
        format: 'json'
        output: trivy_full.json
        exit-code: '0'
        ignore-unfixed: true
        
    - name: Extract Trivy summary from JSON
      run: |
        jq -r '
          {
            critical: ([.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length),
            high: ([.Results[].Vulnerabilities[]? | select(.Severity == "HIGH")] | length),
            medium: ([.Results[].Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length)
          }
        ' trivy_full.json > trivy_summary.json

        cat trivy_summary.json

    - name: Upload Trivy summary to S3
      run: |
        aws s3 cp trivy_summary.json s3://${{ secrets.S3_REPORT_BUCKET }}/trivy/${{ github.run_id }}/trivy_summary.json

    - name: Tag and Push Docker image
      run: |
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.image_tag.outputs.tag }} $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.image_tag.outputs.tag }}
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest