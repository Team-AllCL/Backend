apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-cd
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-cd
  template:
    metadata:
      labels:
        app: order-cd
    spec:
      containers:
        - name: order-cd
          image: 961341508965.dkr.ecr.ap-northeast-2.amazonaws.com/order-ci:latest
          ports:
          - containerPort: 8080
      imagePullSecrets:
        - name: ecr-registry-secret