apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-cd
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-cd
  template:
    metadata:
      labels:
        app: order-cd
    spec:
      containers:
        - name: order-cd
          image: 961341508965.dkr.ecr.ap-northeast-2.amazonaws.com/order-ci:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m" #최소요청 (0.1core)
            limits:
              cpu: "200m" #최대허용
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password

        # 해당 부분을 추가!!
        - name: monitoring-sidecar
          image: 961341508965.dkr.ecr.ap-northeast-2.amazonaws.com/monitoring-sidecar:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9100

      imagePullSecrets:
        - name: ecr-registry-secret
