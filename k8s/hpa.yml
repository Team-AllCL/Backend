apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: order-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-cd # edeployment 이름과 동일!!!
  minReplicas: 2
  maxReplicas: 20  # 기존 4 → 10 -> 50 .
  targetCPUUtilizationPercentage: 95 #  기존 20 -> 10
