version: 0.2
# test
phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo Installing dependencies...

  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws --version
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
      - REPOSITORY_URI=961341508965.dkr.ecr.ap-northeast-2.amazonaws.com/order-ci
      - aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 961341508965.dkr.ecr.ap-northeast-2.amazonaws.com

  build:
    commands:
      - echo Building the JAR file...
      - chmod +x ./gradlew
      - ./gradlew clean build -x test
      - echo Building the Docker image...
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest

  post_build:
    commands:
      - echo Pushing Docker images to ECR...
      - printf '[{"name":"ticketing-backend","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
artifacts:
  files:
    - imagedefinitions.json
