version: 0.2

env:
  variables:
    REPOSITORY_NAME: ticketing-backend
    REPOSITORY_URI: 961341508965.dkr.ecr.ap-northeast-2.amazonaws.com/$REPOSITORY_NAME

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - yum install -y jq

  pre_build:
    commands:
      - export IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-northeast-2 \
          | docker login --username AWS --password-stdin $REPOSITORY_URI

  build:
    commands:
      - chmod +x ./gradlew
      - ./gradlew clean build -x test
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest

  post_build:
    commands:
      - echo Pushing images...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:latest
      - printf '[{"name":"ticketing-container","imageUri":"%s"}]' \
          $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

      # 1) Start scan
      - aws ecr start-image-scan \
          --repository-name $REPOSITORY_NAME \
          --image-id imageTag=$IMAGE_TAG \
          --region ap-northeast-2

      # 2) Wait with timeout
      - |
        for i in $(seq 1 30); do
          status=$(aws ecr describe-image-scan-findings \
                     --repository-name $REPOSITORY_NAME \
                     --image-id imageTag=$IMAGE_TAG \
                     --region ap-northeast-2 \
                     --query 'imageScanStatus.status' --output text)
          [ "$status" = "COMPLETE" ] && break
          sleep 10
        done
        if [ "$status" != "COMPLETE" ]; then
          echo "Scan did not complete in time." >&2
          exit 1
        fi

      # 3) Fetch report & enforce thresholds
      - |
        aws ecr describe-image-scan-findings \
          --repository-name $REPOSITORY_NAME \
          --image-id imageTag=$IMAGE_TAG \
          --region ap-northeast-2 \
          --output json \
          > scan-report.json

      - high=$(jq -r '.imageScanFindings.findingSeverityCounts.HIGH // 0' scan-report.json)
      - crit=$(jq -r '.imageScanFindings.findingSeverityCounts.CRITICAL // 0' scan-report.json)
      - echo "High: $high, Critical: $crit"
      - |
        if [ "$crit" -gt 0 ] || [ "$high" -gt 5 ]; then
          echo "Failing due to vulnerabilities." >&2
          exit 1
        fi

artifacts:
  files:
    - imagedefinitions.json